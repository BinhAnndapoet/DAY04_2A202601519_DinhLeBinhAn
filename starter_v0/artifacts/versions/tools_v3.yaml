# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng CỦA MỘT TÀI KHOẢN cụ thể. Chỉ dùng khi người dùng nêu đích danh chủ tài khoản (vd: 'tweet của @sama'). KHÔNG dùng khi người dùng tìm bài đăng VỀ một chủ đề — đó là social_search."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle của tài khoản, không có @ (vd: sama). Không bao giờ điền tên sản phẩm/chủ đề vào đây."}
        limit: {type: integer, default: 5, description: "Số bài đăng cần lấy. Lấy đúng con số người dùng nêu."}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng VỀ MỘT CHỦ ĐỀ/từ khóa trên mạng xã hội (vd: 'tweet về Claude', 'tweet về Gemini 3'). Đây là lựa chọn mặc định cho 'tìm tweet về X'; chỉ dùng timeline khi X là chủ tài khoản."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa/chủ đề cần tìm."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Latest = mới nhất/gần đây. Top = phổ biến nhất/nhiều tương tác nhất. Chọn theo đúng chữ người dùng dùng."}
        limit: {type: integer, default: 5, description: "Số bài đăng cần lấy. Nếu người dùng nêu con số (kể cả ở turn trước), phải dùng đúng con số đó."}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn, giữ nguyên từ khóa của người dùng."}
        topic: {type: string, enum: [general, news], default: "general", description: "news khi người dùng hỏi tin tức/thời sự; general cho kiến thức chung."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "'hôm nay/24h' -> day; 'tuần này' -> week; 'tháng này/30 ngày' -> month; 'năm nay' -> year."}
        max_results: {type: integer, default: 5, description: "Số kết quả. Nếu người dùng nêu con số (vd '8 kết quả') phải dùng đúng con số đó."}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung sẽ được đăng (KHÔNG phải câu lệnh của người dùng)."}
        confirmed: {type: boolean, default: false, description: "Đặt true CHỈ KHI người dùng đã xác nhận rõ ràng ở lượt gần nhất. Nếu người dùng đã duyệt/xác nhận thì bắt buộc truyền true, không hỏi lại."}
      required: [text, confirmed]

  - name: policy
    description: "Tra cứu QUY ĐỊNH NỘI BỘ của công ty (không phải web). Dùng khi câu hỏi nhắc tới 'quy định', 'chính sách', 'nội bộ', 'công ty'."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "BẮT BUỘC chọn đúng mảng khi câu hỏi đã nêu rõ chủ đề, chỉ để 'all' khi thật sự không xác định được. tool_usage = dùng tool/tự động hóa/agent; ai_research = nghiên cứu AI; source_citation = trích dẫn nguồn; data_privacy = dữ liệu cá nhân/bảo mật; external_publishing = đăng/gửi ra bên ngoài."}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query, policy_area]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "'bài NỘP mới nhất/mới công bố' -> submittedDate; 'bài CẬP NHẬT gần đây' -> lastUpdatedDate; mặc định relevance."}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Reasoning tools ----------------
  # Strategic reflection. Use only for genuinely multi-step research, never for a
  # simple single-tool request (keeps single-step eval routing clean).
  - name: think
    description: "Ghi lại phản tư giữa các bước nghiên cứu: đã tìm được gì, còn thiếu gì, làm gì tiếp. Chỉ dùng khi cần nhiều bước, không truy xuất dữ liệu."
    parameters:
      type: object
      properties:
        reflection: {type: string, default: "", description: "Phản tư: phát hiện, thiếu sót, hành động kế tiếp"}
      required: [reflection]
